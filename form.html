  default: 
  <form action="">
    <input id="email" type="email" required />
    <input id="text" type="text" value="" pattern="[0-9]{11}" required />
    <input id="number" type="tel" required />
    <input type="submit" value="提交">
  </form>

  <hr>

  vue:
  <div id="app">
    <form>
      <input id="visible" ref="visible" name="visible" type="text" pattern="\w+" v-model="value" @input="change" required />
      <input id="hidden" name="hidden" type="text" required />
      <input type="submit" value="提交">
    </form>
  </div>
</body>
<script type="module">
  import { createApp, ref, onMounted } from 'vue'
  const email = document.getElementById('email')
  console.log(email)
  email.addEventListener('input', (e) => {
    console.log(email.validity)
    if (email.validity.typeMismatch) {
      email.setCustomValidity('请输入正确邮箱')
    } else {
      email.setCustomValidity('')
    }
  })

  const text = document.getElementById('text')
  console.log(text)
  text.addEventListener('input', (e) => {
    console.log(text.validity)
    if (text.validity.patternMismatch) {
      text.setCustomValidity('请输入正确号码')
    } else {
      text.setCustomValidity('')
    }
  })

  createApp({
    setup(props, {  }) {
      const value = ref('')
      const change = (e) => {
        console.log(e.target.validity)
        if (e.target.validity.patternMismatch) {
          e.target.setCustomValidity('nonono')
        } else {
          e.target.setCustomValidity('')
        }
      }

      // onMounted(() => {
      //   const visible = document.getElementById('visible')
      //   console.log(visible.target)
      // })

      return {
        change,
        value
      }
    }
  }).mount('#app')

</script>
</html>
